<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examinus — Checklist de Testes Manuais</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,.12);
    --yellow: #d29922;
    --yellow-bg: rgba(210,153,34,.12);
    --red: #f85149;
    --red-bg: rgba(248,81,73,.12);
    --blue: #58a6ff;
    --blue-bg: rgba(88,166,255,.12);
    --purple: #bc8cff;
    --ios: #007aff;
    --android: #3ddc84;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .top-bar h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  .top-bar .logo { font-size: 24px; }

  .progress-wrap {
    flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px;
  }
  .progress-bar {
    flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .3s; }
  .progress-text { font-size: 13px; color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .platform-toggle {
    display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .platform-toggle button {
    background: transparent; border: none; color: var(--text2); padding: 6px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .platform-toggle button.active { background: var(--blue-bg); color: var(--blue); }
  .platform-toggle button:not(:last-child) { border-right: 1px solid var(--border); }

  .actions { display: flex; gap: 8px; }
  .actions button {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .2s;
  }
  .actions button:hover { color: var(--text); border-color: var(--text2); }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 80px; }

  .section {
    margin-bottom: 28px; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--surface);
  }
  .section-header {
    padding: 14px 18px; background: var(--surface2); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    user-select: none; border-bottom: 1px solid var(--border);
  }
  .section-header:hover { background: #1f2940; }
  .section-header h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .section-header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }
  .badge-done { background: var(--green-bg); color: var(--green); }
  .badge-partial { background: var(--yellow-bg); color: var(--yellow); }
  .badge-pending { background: var(--red-bg); color: var(--red); }
  .section-header .chevron { transition: transform .2s; color: var(--text2); }
  .section-header.collapsed .chevron { transform: rotate(-90deg); }

  .section-body { padding: 0; }
  .section-body.hidden { display: none; }

  .test-row {
    display: grid;
    grid-template-columns: 44px 60px 1fr 1fr 80px 80px;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    transition: background .15s;
  }
  .test-row:last-child { border-bottom: none; }
  .test-row:hover { background: rgba(255,255,255,.02); }

  .test-row .id { color: var(--text2); font-variant-numeric: tabular-nums; font-size: 12px; }
  .test-row .scenario { font-weight: 500; }
  .test-row .expected { color: var(--text2); font-size: 12px; }

  .check-cell {
    display: flex; align-items: center; justify-content: center;
  }
  .check-cell input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: var(--green);
    border-radius: 3px;
  }
  .check-cell.ios input[type="checkbox"] { accent-color: var(--ios); }
  .check-cell.android input[type="checkbox"] { accent-color: var(--android); }

  .col-header {
    display: grid;
    grid-template-columns: 44px 60px 1fr 1fr 80px 80px;
    padding: 8px 18px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text2); background: rgba(0,0,0,.2);
    border-bottom: 1px solid var(--border);
  }
  .col-header .ios-label { color: var(--ios); text-align: center; }
  .col-header .android-label { color: var(--android); text-align: center; }

  .subsection-title {
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    color: var(--purple); background: rgba(188,140,255,.06);
    border-bottom: 1px solid var(--border);
  }

  .summary-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 24px; display: flex; justify-content: center; gap: 32px;
    font-size: 13px; z-index: 100;
  }
  .summary-bar .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  .filter-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .filter-row label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .filter-row input[type="checkbox"] { accent-color: var(--blue); }

  @media (max-width: 768px) {
    .test-row { grid-template-columns: 36px 50px 1fr 80px 80px; font-size: 12px; }
    .test-row .expected { display: none; }
    .col-header { grid-template-columns: 36px 50px 1fr 80px 80px; }
    .col-header .exp-label { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Examinus — Testes Manuais</h1>

  </div>
  <div class="filter-row">

    <label><input type="checkbox" id="filterDone" checked> Concluidos</label>
  </div>
  <div class="actions">

// State — merge localStorage com E2E coverage
const savedState = JSON.parse(localStorage.getItem('examinus_tests') || '{}');
const e2eState = {};
E2E_COVERED.forEach(id => {
  e2eState[`${id}_ios`] = true;
  e2eState[`${id}_android`] = true;
});
let state = { ...e2eState, ...savedState };

function saveState() {
  localStorage.setItem('examinus_tests', JSON.stringify(state));
}

function getKey(testId, platform) {
  return `${testId}_${platform}`;
}

function isChecked(testId, platform) {
  return !!state[getKey(testId, platform)];
}

function toggle(testId, platform) {
  const k = getKey(testId, platform);
  state[k] = !state[k];
  saveState();
  updateProgress();
  updateSectionBadges();
}

function getAllTests() {
  const tests = [];
  DATA.forEach(s => s.subs.forEach(sub => sub.tests.forEach(t => tests.push(t))));
  return tests;
}

function countChecked() {
  const tests = getAllTests();
  let iosTotal = 0, iosChecked = 0, androidTotal = 0, androidChecked = 0;
  tests.forEach(t => {
    if (!t.androidOnly) { iosTotal++; if (isChecked(t.id, 'ios')) iosChecked++; }
    if (!t.iosOnly) { androidTotal++; if (isChecked(t.id, 'android')) androidChecked++; }
  });
  return { iosTotal, iosChecked, androidTotal, androidChecked, total: iosTotal + androidTotal, checked: iosChecked + androidChecked };
}

function updateProgress() {
  const c = countChecked();
  const pct = c.total ? Math.round(c.checked / c.total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${c.checked} / ${c.total} (${pct}%)`;
  document.getElementById('iosCount').textContent = `${c.iosChecked}/${c.iosTotal}`;
  document.getElementById('androidCount').textContent = `${c.androidChecked}/${c.androidTotal}`;
  const bothDone = getAllTests().filter(t => {
    const needIos = !t.androidOnly;
    const needAndroid = !t.iosOnly;
    return (!needIos || isChecked(t.id,'ios')) && (!needAndroid || isChecked(t.id,'android'));
  }).length;
  document.getElementById('bothCount').textContent = `${bothDone}/${getAllTests().length}`;
}

function sectionStats(section) {
  let total = 0, checked = 0;
  section.subs.forEach(sub => sub.tests.forEach(t => {
    if (!t.androidOnly) { total++; if (isChecked(t.id,'ios')) checked++; }
    if (!t.iosOnly) { total++; if (isChecked(t.id,'android')) checked++; }
  }));
  return { total, checked };
}

function updateSectionBadges() {
  DATA.forEach(section => {
    const badge = document.getElementById(`badge-${section.id}`);
    if (!badge) return;
    const s = sectionStats(section);
    if (s.checked === s.total) {
      badge.className = 'badge badge-done';
      badge.textContent = `${s.checked}/${s.total} ✓`;
    } else if (s.checked > 0) {
      badge.className = 'badge badge-partial';
      badge.textContent = `${s.checked}/${s.total}`;
    } else {
      badge.className = 'badge badge-pending';
      badge.textContent = `0/${s.total}`;
    }
  });
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  DATA.forEach(section => {
    html += `<div class="section">`;
    html += `<div class="section-header" onclick="toggleSection('${section.id}')" id="header-${section.id}">`;
    html += `<h2>${section.title} <span class="badge badge-pending" id="badge-${section.id}">0/0</span></h2>`;
    html += `<span class="chevron">▼</span>`;
    html += `</div>`;
    html += `<div class="section-body" id="body-${section.id}">`;
    html += `<div class="col-header"><span></span><span>#</span><span>Cenario</span><span class="exp-label">Resultado Esperado</span><span class="ios-label"> iOS</span><span class="android-label"> Android</span></div>`;

    section.subs.forEach(sub => {
      html += `<div class="subsection-title">▸ ${sub.title}</div>`;
      sub.tests.forEach(t => {
        const iosDisabled = t.androidOnly ? 'disabled' : '';
        const androidDisabled = t.iosOnly ? 'disabled' : '';
        const iosCheck = isChecked(t.id, 'ios') ? 'checked' : '';
        const androidCheck = isChecked(t.id, 'android') ? 'checked' : '';
        const rowClass = (isChecked(t.id,'ios') || t.androidOnly) && (isChecked(t.id,'android') || t.iosOnly) ? 'style="opacity:.5"' : '';

        html += `<div class="test-row" id="row-${t.id}" ${rowClass}>`;
        html += `<span></span>`;
        html += `<span class="id">${t.id}</span>`;
        html += `<span class="scenario">${t.name}${t.iosOnly ? ' <small style="color:var(--ios)">(iOS)</small>' : ''}${t.androidOnly ? ' <small style="color:var(--android)">(Android)</small>' : ''}</span>`;
        html += `<span class="expected">${t.expected}</span>`;
        html += `<span class="check-cell ios"><input type="checkbox" ${iosCheck} ${iosDisabled} onchange="toggle('${t.id}','ios'); updateRow('${t.id}')"></span>`;
        html += `<span class="check-cell android"><input type="checkbox" ${androidCheck} ${androidDisabled} onchange="toggle('${t.id}','android'); updateRow('${t.id}')"></span>`;
        html += `</div>`;
      });
    });

    html += `</div></div>`;
  });

  app.innerHTML = html;
  updateProgress();
  updateSectionBadges();
}

function updateRow(testId) {
  const t = getAllTests().find(x => x.id === testId);
  if (!t) return;
  const row = document.getElementById(`row-${testId}`);
  if (!row) return;
  const bothDone = (isChecked(t.id,'ios') || t.androidOnly) && (isChecked(t.id,'android') || t.iosOnly);
  row.style.opacity = bothDone ? '.5' : '1';
}

function toggleSection(id) {
  const body = document.getElementById(`body-${id}`);
  const header = document.getElementById(`header-${id}`);
  body.classList.toggle('hidden');
  header.classList.toggle('collapsed');
}

function resetAll() {
  if (confirm('Tem certeza que deseja resetar TODOS os checks?')) {
    state = {};
    saveState();
    render();
  }
}

function exportResults() {
  const c = countChecked();
  let text = `EXAMINUS — Resultado dos Testes Manuais\n`;
  text += `Data: ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')}\n`;
  text += `Progresso: ${c.checked}/${c.total} (${Math.round(c.checked/c.total*100)}%)\n`;
  text += `iOS: ${c.iosChecked}/${c.iosTotal} | Android: ${c.androidChecked}/${c.androidTotal}\n`;
  text += `${'='.repeat(70)}\n\n`;

  DATA.forEach(section => {
    const s = sectionStats(section);
    text += `${section.title} — ${s.checked}/${s.total}\n`;
    section.subs.forEach(sub => {
      text += `  ${sub.title}:\n`;
      sub.tests.forEach(t => {
        const ios = t.androidOnly ? '—' : (isChecked(t.id,'ios') ? '✓' : '✗');
        const android = t.iosOnly ? '—' : (isChecked(t.id,'android') ? '✓' : '✗');
        text += `    [iOS:${ios}] [Android:${android}] ${t.id} ${t.name}\n`;
      });
    });
    text += '\n';
  });

  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `examinus-testes-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

// Filters
document.getElementById('filterPending').addEventListener('change', applyFilters);
document.getElementById('filterDone').addEventListener('change', applyFilters);

function applyFilters() {
  const showPending = document.getElementById('filterPending').checked;
  const showDone = document.getElementById('filterDone').checked;
  getAllTests().forEach(t => {
    const row = document.getElementById(`row-${t.id}`);
    if (!row) return;
    const bothDone = (isChecked(t.id,'ios') || t.androidOnly) && (isChecked(t.id,'android') || t.iosOnly);
    if (bothDone && !showDone) row.style.display = 'none';
    else if (!bothDone && !showPending) row.style.display = 'none';
    else row.style.display = '';
  });
}

render();
// Persistir estado merged (E2E + localStorage) na primeira carga
saveState();
