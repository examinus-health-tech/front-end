appId: com.examinus.app
name: "Upload - Arquivo inválido e estados de progresso"
tags:
  - authenticated
---
# Checklist: 5.1.7 (arquivo inválido), 5.1.8 (estados de progresso)

- runFlow: ../utils/wait_for_home.yaml

# Abrir upload
- tapOn:
    id: "tab-upload"

- waitForAnimationToEnd:
    timeout: 3000

# === 5.1.7-5.1.8 — Verificar opções de upload visíveis ===
# NÃO clicar no botão de upload pra evitar abrir picker nativo
- assertVisible:
    id: "btn-upload-pdf"

- assertVisible:
    id: "btn-upload-image"

- takeScreenshot: "65_upload_states"

# Fechar bottom sheet (tap fora)
- tapOn:
    point: "50%,10%"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "tab-home"

- extendedWaitUntil:
    visible:
      id: "screen-homepage"
    timeout: 10000
