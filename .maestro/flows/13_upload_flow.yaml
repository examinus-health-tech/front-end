appId: com.examinus.app
name: "Upload - Fluxo completo com PDF real"
tags:
  - authenticated
  - critical
---
- runFlow: ../utils/wait_for_home.yaml

# Abrir bottom sheet de upload
- tapOn:
    id: "tab-upload"
- waitForAnimationToEnd:
    timeout: 3000

# Selecionar opção PDF
- tapOn:
    id: "btn-upload-pdf"
- waitForAnimationToEnd:
    timeout: 5000

# Navegar no document picker: Browse → On My iPhone → Selecionar PDF
- tapOn:
    text: "Browse"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: ".*On My.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Selecionar o PDF via thumbnail (point tap na área do arquivo)
- tapOn:
    point: "15%,25%"
- waitForAnimationToEnd:
    timeout: 10000

# Verificar tela de sucesso (ScoreWarning)
- extendedWaitUntil:
    visible:
      id: "screen-score-warning"
    timeout: 30000

- takeScreenshot: "13_upload_success"

# Continuar
- tapOn:
    id: "btn-score-continue"

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: "13_upload_complete"
