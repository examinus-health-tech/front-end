appId: com.examinus.app
name: "Configurações - Sobre e Contato"
tags:
  - authenticated
---
- runFlow: ../utils/wait_for_home.yaml

- tapOn:
    id: "tab-account"
- tapOn:
    id: "tab-account"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "card-about"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "card-about"

- extendedWaitUntil:
    visible:
      id: "screen-about-us"
    timeout: 10000

- takeScreenshot: "24_settings_about"

- tapOn:
    id: "btn-back"

- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "card-contact"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "card-contact"

- extendedWaitUntil:
    visible:
      id: "screen-contact-us"
    timeout: 10000

- tapOn:
    id: "btn-back"

- tapOn:
    id: "tab-home"
