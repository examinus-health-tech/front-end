appId: com.examinus.app
name: "Login - Validação de campos"
---
- launchApp:
    stopApp: false

# Se estiver na Welcome, navegar para login
- tapOn:
    id: "btn-go-to-login"
    optional: true

# Aguardar tela de login via testID
- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 15000

# Tentar login com campos vazios
- tapOn:
    id: "btn-login"

# Tentar com email inválido
- tapOn:
    id: "input-email"
- inputText: "emailinvalido"
- tapOn:
    point: "50%,30%"

- tapOn:
    id: "btn-login"

# Verificar que ainda está na tela de login
- assertVisible:
    id: "screen-login"

- takeScreenshot: "03_login_validation"
