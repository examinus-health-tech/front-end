appId: com.examinus.app
name: "Login - Toggle visibilidade da senha"
tags:
  - unauthenticated
---
# Checklist: 1.2.5 — Toggle visibilidade da senha

- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 30000

- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      text: ".*Entre.*"
    timeout: 15000

# Preencher senha via coordenadas (campo de senha ~44% y)
- tapOn:
    point: "50%,44%"

- waitForAnimationToEnd:
    timeout: 1500

- inputText: "TesteSenha123"

- hideKeyboard

- waitForAnimationToEnd:
    timeout: 1500

- takeScreenshot: "53_login_password_hidden"

# Toggle para exibir senha (ícone de olho no lado direito do campo ~90%,44%)
- tapOn:
    point: "90%,44%"

- waitForAnimationToEnd:
    timeout: 1500

- takeScreenshot: "53_login_password_toggle"
