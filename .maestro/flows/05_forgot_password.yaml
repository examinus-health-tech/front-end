appId: com.examinus.app
name: "Esqueci minha senha - Fluxo"
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 15000

# Ir para login
- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 10000

# Ir para esqueci senha
- tapOn:
    text: ".*Esqueceu a senha.*"

# Verificar tela via testID
- extendedWaitUntil:
    visible:
      id: "screen-forgot-password"
    timeout: 10000

# Verificar elementos
- assertVisible:
    id: "input-email"
- assertVisible:
    id: "btn-send"
