appId: com.examinus.app
name: "Login - Senha incorreta"
---
- launchApp:
    stopApp: false

# Navegar para login
- tapOn:
    id: "btn-go-to-login"
    optional: true

- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 15000

# Preencher email válido
- tapOn:
    id: "input-email"
- inputText: "usuario@teste.com"
- tapOn:
    point: "50%,30%"

# Preencher senha incorreta
- tapOn:
    id: "input-password"
- inputText: "SenhaErrada999"
- tapOn:
    point: "50%,30%"

# Tentar login
- tapOn:
    id: "btn-login"

# Aguardar resposta da API
- waitForAnimationToEnd:
    timeout: 5000

# Deve permanecer na tela de login (credenciais inválidas)
- assertVisible:
    id: "screen-login"

- takeScreenshot: "32_login_wrong_password"
