appId: com.examinus.app
name: "Cadastro - Senhas divergentes e senha fraca"
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 15000

# Navegar para login e depois cadastro
- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 10000

- tapOn:
    text: ".*Cadastre-se.*"

- extendedWaitUntil:
    visible:
      id: "screen-signup"
    timeout: 10000

# === Teste 1: Senhas que não conferem ===
- tapOn:
    id: "input-name"
- inputText: "Teste E2E"

- tapOn:
    id: "input-email"
- inputText: "teste_e2e@example.com"

- tapOn:
    id: "input-password"
- inputText: "Senha@123"

- scrollUntilVisible:
    element:
      id: "input-confirm-password"
    direction: DOWN

- tapOn:
    id: "input-confirm-password"
- inputText: "SenhaDiferente@456"

# Fechar teclado
- tapOn:
    point: "50%,20%"

- scrollUntilVisible:
    element:
      id: "btn-signup"
    direction: DOWN

- tapOn:
    id: "btn-signup"

# Deve permanecer na tela de cadastro (validação falhou)
- assertVisible:
    id: "screen-signup"

- takeScreenshot: "33_signup_password_mismatch"
