appId: com.examinus.app
name: "Cadastro - Senha fraca"
tags:
  - unauthenticated
---
# Checklist: 1.5.3 — Senha fraca (ex: 123)

- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 30000

- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      text: ".*Entre.*"
    timeout: 15000

# Navegar para cadastro
- tapOn:
    text: ".*Cadastre-se.*"

- waitForAnimationToEnd:
    timeout: 5000

# Verificar tela de cadastro
- assertVisible:
    id: "screen-signup"
    optional: true

- takeScreenshot: "77_signup_weak_password"
