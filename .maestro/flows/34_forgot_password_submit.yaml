appId: com.examinus.app
name: "Esqueci senha - Enviar email de recuperação"
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 15000

# Ir para login
- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      id: "screen-login"
    timeout: 10000

# Ir para esqueci senha
- tapOn:
    text: ".*Esqueceu a senha.*"

- extendedWaitUntil:
    visible:
      id: "screen-forgot-password"
    timeout: 10000

# Preencher email
- tapOn:
    id: "input-email"
- inputText: "recuperacao@teste.com"
- tapOn:
    point: "50%,30%"

# Enviar solicitação
- tapOn:
    id: "btn-send"

# Aguardar resposta
- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: "34_forgot_password_submit"
