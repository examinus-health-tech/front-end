appId: com.examinus.app
name: "Configurações - Preferências"
tags:
  - authenticated
---
- runFlow: ../utils/wait_for_home.yaml

- tapOn:
    id: "tab-account"
- tapOn:
    id: "tab-account"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000

- tapOn:
    id: "card-preferences"

- extendedWaitUntil:
    visible:
      id: "screen-preferences"
    timeout: 10000

- takeScreenshot: "23_settings_preferences"

- tapOn:
    id: "btn-back"

- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 10000

- tapOn:
    id: "tab-home"

- extendedWaitUntil:
    visible:
      id: "screen-homepage"
    timeout: 10000
