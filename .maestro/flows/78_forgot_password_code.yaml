appId: com.examinus.app
name: "Recuperação de Senha - Fluxo de código"
tags:
  - unauthenticated
---
# Checklist: 1.6.2-1.6.5 — Email inválido, código, nova senha

- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: "screen-welcome"
    timeout: 30000

- tapOn:
    id: "btn-go-to-login"

- extendedWaitUntil:
    visible:
      text: ".*Entre.*"
    timeout: 15000

# Ir para esqueci senha
- tapOn:
    text: ".*Esqueceu.*"

- extendedWaitUntil:
    visible:
      id: "screen-forgot-password"
    timeout: 10000
    optional: true

- extendedWaitUntil:
    visible:
      text: ".*Recuper.*|.*Esquec.*|.*E-mail.*"
    timeout: 10000

# Verificar tela de recuperação
- assertVisible:
    text: ".*Recuper.*|.*Esquec.*|.*enviar.*"
    optional: true

- takeScreenshot: "78_forgot_password_code"
